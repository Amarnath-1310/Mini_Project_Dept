# Clinical-NIDS Backend Configuration
spring.application.name=clinical-nids-backend

# Server
server.port=8080

# MySQL database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/clinical_nids?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:1234}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:local-development-only-secret-change-this-before-deployment-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ML Service URL
app.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.clinicalnids=DEBUG
logging.level.org.springframework.security=INFO

# File Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true
app.upload.dir=${UPLOAD_DIR:./uploads}
